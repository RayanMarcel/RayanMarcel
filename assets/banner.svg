<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Rayan Cavalheiro, fundador da CodeZord" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.row{fill:none;stroke:#C9BEA9;stroke-width:2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s ease-out forwards}
.trace{fill:none;stroke:#A8612E;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.1s ease-in-out 1.2s forwards}
.node{fill:#A8612E;opacity:0;animation:show .3s ease-out forwards}
.n1{animation-delay:1.2s} .n2{animation-delay:2.2s}
.txt{opacity:0;animation:show .8s ease-out forwards}
.serif{font-family:Georgia,'Times New Roman',serif}
.sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.row,.trace{animation:none;stroke-dashoffset:0}.node,.txt{animation:none;opacity:1}}
</style>
<defs>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".25" stop-color="#fff"/></linearGradient>
<mask id="m"><rect x="720" y="0" width="480" height="340" fill="url(#fade)"/></mask>
<clipPath id="c"><rect width="1200" height="340" rx="14"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="340" fill="#EDE6D8"/>
<g mask="url(#m)">
<path class="row" style="animation-delay:0.00s" d="M 780 -10 C 850 100, 730 220, 805 350"/>
