<path class="row" style="animation-delay:0.78s" d="M 1222 -10 C 1292 100, 1172 220, 1247 350"/>
<path class="row" style="animation-delay:0.84s" d="M 1256 -10 C 1326 100, 1206 220, 1281 350"/>
</g>
<path class="trace" d="M 96 262 H 600 L 630 232 H 848.0"/>
<circle class="node n1" cx="96" cy="262" r="6"/>
<circle class="node n2" cx="848.0" cy="232" r="6"/>
<text class="txt sans" x="96" y="78" font-size="17" fill="#6E665B" style="animation-delay:.1s">Mato Grosso do Sul, Brasil</text>
<text class="txt serif" x="92" y="162" font-size="66" fill="#23201B" style="animation-delay:.2s">Rayan Cavalheiro</text>
<text class="txt sans" x="96" y="210" font-size="26" fill="#A8612E" font-weight="600" style="animation-delay:.5s">Fundador da CodeZord</text>
<text class="txt sans" x="96" y="304" font-size="18" fill="#6E665B" style="animation-delay:2.2s">Processos, software sob medida, automação e IA para gestão</text>
</g>
</svg>