<path class="row" style="animation-delay:0.30s" d="M 950 -10 C 1020 100, 900 220, 975 350"/>
<path class="row" style="animation-delay:0.36s" d="M 984 -10 C 1054 100, 934 220, 1009 350"/>
<path class="row" style="animation-delay:0.42s" d="M 1018 -10 C 1088 100, 968 220, 1043 350"/>
<path class="row" style="animation-delay:0.48s" d="M 1052 -10 C 1122 100, 1002 220, 1077 350"/>
